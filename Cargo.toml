[package]
name = "trainlcd-review-triage"
version = "0.1.0"
edition = "2024"
description = "Official store reviews to evidence-backed TrainLCD GitHub issues"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
encoding_rs = "0.8"
fs2 = "0.4"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2"

