name: PR18 live review verification
on:
  push:
    branches: [verify/triage-pr18]
    paths: [.github/workflows/verify-pr18.yml]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep bubblewrap
      - run: npm install --global @openai/codex
      - run: cargo build --release --locked
      - run: timeout 30s codex sandbox -c 'sandbox_mode="read-only"' -- /bin/cat Cargo.toml > /dev/null
      - name: Probe analysis tool execution
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          probe_dir=$(mktemp -d)
          mkdir -p "$probe_dir/home" "$probe_dir/config" "$probe_dir/codex"
          HOME="$probe_dir/home" XDG_CONFIG_HOME="$probe_dir/config" CODEX_HOME="$probe_dir/codex" timeout 120s codex exec --json --ignore-user-config --ignore-rules --ephemeral --sandbox read-only --skip-git-repo-check -c shell_environment_policy.inherit=none -c "shell_environment_policy.set.PATH=\"$PATH\"" -c 'mcp_servers={}' 'Run cat Cargo.toml using a shell tool. Report whether it succeeded. Do not modify files or use network.' > "$RUNNER_TEMP/probe.jsonl" 2>&1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for line in Path(os.environ['RUNNER_TEMP']+'/probe.jsonl').read_text().splitlines():
              try: e=json.loads(line)
              except ValueError: continue
              item=e.get('item', {})
              print(json.dumps({'type':e.get('type'), 'item_type':item.get('type'), 'keys':list(item), 'status':item.get('status'), 'exit_code':item.get('exit_code'), 'tool':item.get('tool'), 'server':item.get('server'), 'bwrap': 'bwrap' in line, 'permission_denied':'Operation not permitted' in line}))
          PY
      - name: Load real reviews from the affected run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43567026780 --repo TrainLCD/ReviewTriage --name review-triage-state --dir previous
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('previous/reviews.json').read_text())
          rows = sorted(rows, key=lambda row: row['updated_at'], reverse=True)[:3]
          Path('input.json').write_text(json.dumps(rows, ensure_ascii=False))
          print(f'Replaying {len(rows)} latest real reviews; no store credentials or publishing.')
          PY
      - name: Verify apply with the same real reviews
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TRIAGE_GITHUB_TOKEN }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cp input.json apply-input.json
          # Refuse writes in this verification run, even if a second analysis changes its decision.
          mkdir -p verify-bin
          real_gh=$(command -v gh)
          printf '#!/bin/bash\nfor arg in "$@"; do\n case "$arg" in POST|PATCH|PUT|DELETE|--method=*) exit 97;; esac\ndone\nexec "%s" "$@"\n' "$real_gh" > verify-bin/gh
          chmod +x verify-bin/gh
          PATH="$PWD/verify-bin:$PATH" target/release/trainlcd-review-triage run --input apply-input.json --state-dir apply-state --apply > "$RUNNER_TEMP/apply.log" 2>&1 || {
            python3 scripts/report_triage_error.py "$RUNNER_TEMP/apply.log"
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('apply-state/report.json').read_text())
          p=json.loads(Path('apply-state/processed.json').read_text())
          assert r['apply'] is True and not r['created_issues']
          uncertain={k for f in r['findings'] if f['status']=='uncertain' for k in f['review_keys']}
          keys={row['store']+':'+row['id'] for row in json.loads(Path('apply-input.json').read_text())}
          assert set(p)==keys-uncertain and len(p)>0
          assert sum(len(f['evidence']) for f in r['findings'])>0
          print(f"Apply verified: {len(p)} reviews marked processed; {len(uncertain)} pending; zero issues created.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr18-verification-report
          path: |
            verification-state/report.json
            apply-state/report.json
          if-no-files-found: ignore
          retention-days: 7
