name: Stop unsafe verification
on:
  push:
    branches: [verify/full-review-apply]
    paths: [.github/workflows/stop-unsafe-verification.yml]
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Stop identified verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 43605878568 --repo TrainLCD/ReviewTriage
