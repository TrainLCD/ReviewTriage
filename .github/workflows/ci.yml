name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - run: npm install --global @openai/codex@0.169.0
      - name: Verify read-only sandbox and retry-free provider config (Codex 0.169.0)
        run: |
          timeout 30s codex sandbox \
            -c 'sandbox_mode="read-only"' \
            -c 'model_provider="review_triage"' \
            -c 'model_providers.review_triage.name="OpenAI"' \
            -c 'model_providers.review_triage.wire_api="responses"' \
            -c 'model_providers.review_triage.requires_openai_auth=true' \
            -c 'model_providers.review_triage.env_http_headers.OpenAI-Organization="OPENAI_ORGANIZATION"' \
            -c 'model_providers.review_triage.env_http_headers.OpenAI-Project="OPENAI_PROJECT"' \
            -c 'model_providers.review_triage.request_max_retries=0' \
            -c 'model_providers.review_triage.stream_max_retries=0' \
            -c shell_environment_policy.inherit=none \
            -c "shell_environment_policy.set.PATH=\"$PATH\"" \
            -- /bin/cat Cargo.toml > /dev/null
