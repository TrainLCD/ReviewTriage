name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - run: npm install --global @openai/codex
      - name: Verify read-only sandbox without API credentials
        run: timeout 30s codex sandbox -c 'sandbox_mode="read-only"' -c shell_environment_policy.inherit=none -c "shell_environment_policy.set.PATH=\"$PATH\"" -- /bin/cat Cargo.toml > /dev/null
